name: Build ARIO Files APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Check project
        run: |
          echo "=== PROJECT ==="
          find . -maxdepth 3 -type f | sort
          echo "=== GRADLE ==="
          gradle --version

      - name: Build APK
        run: gradle --stacktrace --info assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArioFileManager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
